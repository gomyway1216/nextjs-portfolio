name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when new commits are pushed to the same ref, so
# rapid pushes don't pile up redundant CI runs (only the latest matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Pin npm to 11.14.1 (matches package.json packageManager)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run dependency-free ML contract tests
        run: npm run test:ml:stdlib

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_API_KEY: ci-placeholder
          NEXT_PUBLIC_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_APP_ID: "1:000000000000:web:ci"
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"

  darwin_exclusive_directory_rename:
    name: Darwin exclusive directory rename
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Pin npm to 11.14.1 (matches package.json packageManager)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Compile the pinned Darwin helper
        run: /usr/bin/python3 -m py_compile ml/helpers/floodgate-exclusive-directory-rename.py

      - name: Require the fixed Darwin lock helper
        run: test -x /usr/bin/lockf

      - name: Require the fixed Darwin process-lifetime helper
        run: test -x /usr/bin/caffeinate

      - name: Require the fixed Darwin native launcher tools
        run: test -x /usr/bin/osascript && test -x /usr/sbin/lsof && test -x /bin/ps

      - name: Run Darwin native-launcher preload adversarial tests
        run: npm test -- tests/unit/ml/floodgateV7ProductionNativeLauncher.test.ts

      - name: Run Darwin exclusive-rename adversarial tests
        run: npm test -- tests/unit/ml/floodgateExclusiveDirectoryRename.test.ts

      - name: Run Darwin production outer-gate lock adversarial tests
        run: npm test -- tests/unit/ml/floodgateV7ProductionOuterGateLease.test.ts

      - name: Run Darwin fresh prefix-100 preflight adversarial tests
        run: npm test -- tests/unit/ml/floodgateV7ProductionPrefix100Preflight.test.ts tests/unit/ml/floodgateV7ProductionPrefix100PreflightCli.test.ts

      - name: Run Darwin prefix-100 same-lock one-shot adversarial tests
        run: npm test -- tests/unit/ml/floodgateV7ProductionPrefix100SameLockOneShot.test.ts tests/unit/ml/floodgateV7ProductionPrefix100RealBoundariesIntegration.test.ts

      - name: Run Darwin disposable prefix-100 kill-drill adversarial tests
        run: npm test -- tests/unit/ml/floodgateV7ProductionPrefix100KillDrill.test.ts tests/unit/ml/floodgateV7ProductionPrefix100KillDrillCli.test.ts

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_KEY: ci-placeholder
      NEXT_PUBLIC_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_APP_ID: "1:000000000000:web:ci"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Pin npm to 11.14.1 (matches package.json packageManager)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Run E2E smoke tests
        run: npm run test:e2e
