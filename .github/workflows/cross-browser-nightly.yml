name: Cross-browser nightly

# The e2e suite in WebKit (Safari's engine) and Firefox against a production build, once a night and on demand.
# The PR CI (ci.yml, "E2E smoke tests") runs Chromium only; this catches the regressions that only Safari or Firefox
# show (line breaks, select heights, focus, cross-tab hand-overs) within a day, without slowing a PR.
#
# Where each engine runs:
# - WebKit on macOS. Playwright's WebKit on Linux is another port of WebKit than Safari's (its own fonts, sound and
#   graphics): on the Ubuntu runner 38 of the 430 tests it reached failed (sound, the pusher's renderer, Japanese
#   widths) before the job ran out of time. On macOS it is Safari's engine with Safari's fonts, and it passes.
# - Firefox on Ubuntu. On the macOS runner Firefox could not run the Medal Pusher's renderer (most of its specs
#   failed, and the job ran out of time); on Ubuntu it does, given what a Japanese reader's machine has (below).

on:
  schedule:
    # 18:00 UTC = 03:00 JST.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.part }}/${{ matrix.parts }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # WebKit in three parts on three macOS runners, one worker each. macOS runners differ a lot in speed (the same
        # suite took 17 minutes on one and 37 on another, with three workers), and on a slow one the pages of several
        # workers starved each other's frames and timers until the tests that time a count-up or wait on the pusher's
        # first frame failed.
        include:
          - { browser: webkit, os: macos-latest, part: 1, parts: 3, workers: 1 }
          - { browser: webkit, os: macos-latest, part: 2, parts: 3, workers: 1 }
          - { browser: webkit, os: macos-latest, part: 3, parts: 3, workers: 1 }
          - { browser: firefox, os: ubuntu-latest, part: 1, parts: 1, workers: 3 }
    env:
      NEXT_PUBLIC_API_KEY: ci-placeholder
      NEXT_PUBLIC_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_APP_ID: "1:000000000000:web:ci"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Pin npm to 11.14.1 (matches package.json packageManager)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} ${{ matrix.browser }}

      # Japanese in Noto Sans CJK JP, as on Android and a Japanese Linux desktop. Playwright's own fonts left Japanese to
      # WenQuanYi Zen Hei, a Chinese face with no bold, which Firefox widens by drawing it bold itself: 「ブラックジャック」
      # came out 120.1 px for 117.5, and five checks of Japanese fitting a phone failed by a pixel or a line.
      # And a sound device (a null sink): with none, Firefox's sound never starts, and the craps throw is never played.
      - name: Japanese fonts and a sound device (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk pulseaudio
          sudo tee /etc/fonts/conf.d/99-japanese-in-noto-sans-cjk.conf > /dev/null <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="pattern">
              <test name="lang" compare="contains"><string>ja</string></test>
              <test qual="any" name="family"><string>sans-serif</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
            </match>
          </fontconfig>
          EOF
          sudo fc-cache -f
          fc-match 'sans-serif:lang=ja'
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nightly
          pactl set-default-sink nightly

      - name: Build production app
        run: npm run build

      - name: Run E2E tests in ${{ matrix.browser }} (part ${{ matrix.part }} of ${{ matrix.parts }})
        run: npx playwright test -c playwright.cross-browser.config.ts --project=${{ matrix.browser }} --shard=${{ matrix.part }}/${{ matrix.parts }} --workers=${{ matrix.workers }}

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-${{ matrix.browser }}-${{ matrix.part }}-of-${{ matrix.parts }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
