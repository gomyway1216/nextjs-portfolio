name: Ogiri multiplayer
on:
  pull_request:
    paths:
      - 'src/lib/ogiri/**'
      - 'src/data/ogiri/**'
      - 'src/components/game/Ogiri/**'
      - 'src/app/api/ogiri/**'
      - 'src/app/games/ogiri/**'
      - 'tests/ogiri/**'
      - 'playwright.ogiri.config.ts'
      - '.github/workflows/ogiri.yml'
  workflow_dispatch:
concurrency:
  group: ogiri-${{ github.ref }}
  cancel-in-progress: true
jobs:
  party:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_API_KEY: ci-placeholder
      NEXT_PUBLIC_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_PROJECT_ID: demo-ogiri
      NEXT_PUBLIC_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_APP_ID: '1:000000000000:web:ci'
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g npm@11.14.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run ogiri:validate
      - run: npm run build
      - run: npx --yes firebase-tools@15.34.1 emulators:exec --project demo-ogiri --config tests/ogiri/firebase.json --only firestore 'npm run test:ogiri:e2e'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ogiri-browser-results
          path: test-results
          retention-days: 14
