name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'

      - name: Pin npm to 11.14.1 (for min-release-age enforcement)
        run: npm install -g npm@11.14.1

      - name: Run npm audit (fail on high or critical)
        run: npm audit --audit-level=high
